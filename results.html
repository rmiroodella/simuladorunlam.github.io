<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" href="./img/logo_unlam.png" type="image/x-icon">
        <script src="results.js" defer></script>
    <title>Resultados del Quiz</title>
</head>
<body>
    
    <div class="loader"></div>

    <header class="header">
        <div class="navbar">
            <div class="nav-title">
                <img src="./img/logo unlam blanco.jpeg" alt="logo" class="unlam-img">
                <h1 class="nav-logo">UNLaM</h1>
            </div>
        </div>
    </header>

    <div class="full-cont">
        <div class="result-cont">
            <div class="result-title">
                <h1>Correccion de respuestas</h1>
            </div>
            <div id="results-container"></div>
            <p class="result-p">No presione este botón hasta que los supervisores hayan visto su puntaje.</p>
            <button onclick="window.location.href='index.html'">Volver al Inicio</button>
        </div>
    </div>

    <script>

        document.addEventListener("DOMContentLoaded", () => {

            window.addEventListener("load", () => {
                
                let loader = document.querySelector(".loader")
                setTimeout(() => {
                    loader.classList.add("loader--hidden");
                loader.addEventListener("transitionend", () => {
                    document.body.removeChild(loader)
                });
                }, 1300);

            });

        });

    </script>

</body>
</html>
